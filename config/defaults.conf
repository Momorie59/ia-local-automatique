# ================================================================
#  Momory - IA Local — Configuration par défaut
#  Ce fichier est chargé en premier par lib/common.sh.
#  L'utilisateur ne doit PAS modifier ce fichier : ses propres
#  réglages vont dans /var/lib/ia-installer/config.env, qui prend
#  toujours le dessus sur ces valeurs par défaut (voir load_config
#  dans lib/common.sh).
# ================================================================

# ── Emplacements système (fixes, ne changent pas d'une machine à l'autre) ──
IA_STATE_DIR="/var/lib/ia-installer"
IA_LOG_DIR="/var/log/ia-installer"
IA_CONFIG_FILE="$IA_STATE_DIR/config.env"
IA_CREDS_FILE="$IA_STATE_DIR/admin-credentials"
IA_PROGRESS_FILE="$IA_STATE_DIR/progress.json"
IA_STATE_FILE="$IA_STATE_DIR/state"
IA_PENDING_CONFIRM_FILE="$IA_STATE_DIR/pending-confirm.json"
IA_CONFIRM_ANSWER_FILE="$IA_STATE_DIR/confirm-answer.json"
IA_INSTALLER_PATH_FILE="$IA_STATE_DIR/installer-path.txt"
IA_WEB_SHARE_DIR="/usr/local/share/ia-installer/web"
DASHBOARD_SCRIPT="/usr/local/bin/ia-dashboard.py"

# ── Emplacements de données ──
# Pas de chemin par défaut figé ici volontairement : configure_infra()
# (lib/interactive_config.sh) propose une suggestion calculée à partir du
# disque de stockage choisi par l'utilisateur (ex: /mnt/ia_sdb), jamais un
# chemin codé en dur — et l'utilisateur peut toujours taper autre chose.

# Anciens emplacements connus, utilisés uniquement pour la détection
# automatique lors d'une réparation (voir lib/repair_webui.sh)
LEGACY_DATA_PATHS=(
  "/mnt/ia_toshiba/open-webui"
  "/mnt/ia_sdb/open-webui"
  "/mnt/ia_storage/open-webui"
  "/root/.open-webui"
  "/var/lib/open-webui"
)

# ── Dashboard web ──
DASHBOARD_PORT_DEFAULT=7842
DASHBOARD_BIND_DEFAULT="0.0.0.0"
DASHBOARD_SESSION_TTL_DEFAULT=86400     # 24h — clamp appliqué : 5min à 7 jours
DASHBOARD_SESSION_TTL_MIN=300
DASHBOARD_SESSION_TTL_MAX=604800

# ── Rate limiting login dashboard (anti brute-force) ──
LOGIN_RATE_LIMIT_MAX_TRIES=5
LOGIN_RATE_LIMIT_WINDOW_SEC=300
LOGIN_RATE_LIMIT_BLOCK_SEC=900

# ── Identifiants par défaut à la première installation ──
# (l'utilisateur est invité à les changer dès la première connexion)
DASHBOARD_DEFAULT_USER="admin"
DASHBOARD_DEFAULT_PASSWORD="ia-local-admin"

# ── Services systemd ──
# DASHBOARD_SERVICE est sans suffixe .service : certains modules (repair_webui.sh)
# construisent le chemin de l'unité en ajoutant eux-mêmes ".service".
DASHBOARD_SERVICE="ia-dashboard"
RESUME_SERVICE="ia-installer-resume.service"
OPEN_WEBUI_SERVICE="open-webui.service"
OLLAMA_SERVICE="ollama.service"

# ── Espace disque minimum requis (Go) ──
MIN_FREE_DISK_GB=100

# ── Qdrant (base vectorielle — mémoire longue durée pour assistants type Momory) ──
QDRANT_PORT_DEFAULT=6333
QDRANT_GRPC_PORT_DEFAULT=6334
QDRANT_IMAGE="qdrant/qdrant"
